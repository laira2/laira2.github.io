# ─────────────────────────────────────────────────────────────────────────────
# Site settings
title: 양혜지ʼs Backend Dev Blog
description: Java·Spring 기반 백엔드 개발 & 코딩테스트 풀이 기록
baseurl: ""     
url: "https://laira2.github.io"
# ─────────────────────────────────────────────────────────────────────────────
# Appearance
theme_skin: default    
favicon: "/assets/images/favicon.ico"
# ─────────────────────────────────────────────────────────────────────────────
# Author / Profile
author:
  name: 양혜지
  bio: "백엔드 개발자 | MSA·CI/CD·Docker·AWS"
  links:
    - label: GitHub
      icon: "fab fa-github"
      url: "https://github.com/laira2"
    - label: Velog
      icon: "fas fa-rss"
      url: "https://velog.io/@laira2"
# ─────────────────────────────────────────────────────────────────────────────
# Navigation (상단 메뉴)
navigation:
  - title: Home
    url: /
  - title: Posts
    url: /year-archive/
  - title: Tags
    url: /tags/
  - title: About
    url: /about/
# ─────────────────────────────────────────────────────────────────────────────
# Footer (하단)
footer:
  content: "© 2025 양혜지. All rights reserved."
# ─────────────────────────────────────────────────────────────────────────────
# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
markdown: kramdown
highlighter: rouge
theme: minimal-mistakes-jekyll


